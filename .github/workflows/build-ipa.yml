name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-export:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🍎 Check Xcode Environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 🛠️ Build Archive (Unsigned / Sideloadable)
        run: |
          mkdir -p build
          xcodebuild archive \
            -project NeonPulse.xcodeproj \
            -scheme NeonPulse \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/NeonPulse.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: 📦 Package .app into .ipa
        run: |
          mkdir -p build/Payload
          cp -r build/NeonPulse.xcarchive/Products/Applications/NeonPulse.app build/Payload/
          cd build
          zip -qr NeonPulse.ipa Payload
          echo "IPA created successfully:"
          ls -lh NeonPulse.ipa
          unzip -l NeonPulse.ipa | head -n 25

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeonPulse-iOS-IPA
          path: build/NeonPulse.ipa
          retention-days: 14

      - name: 🏷️ Publish GitHub Release (When Tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/NeonPulse.ipa
          name: Release ${{ github.ref_name }}
          body: |
            🎮 **Neon Pulse: Cyber Strike - Version ${{ github.ref_name }}**
            
            ### Comment installer l'IPA sur iPhone / iPad :
            1. **AltStore** : Téléchargez le fichier `.ipa`, ouvrez AltStore sur votre iPhone et appuyez sur le bouton `+` pour installer.
            2. **Sideloadly** : Glissez-déposez le fichier `NeonPulse.ipa` sur Sideloadly (PC/Mac) relié à votre iPhone.
            3. **TrollStore** : Ouvrez directement le fichier `.ipa` avec TrollStore.
            4. **Scarlet / LiveContainer** : Importez directement le fichier `.ipa`.
            
            *Nécessite iOS 15.0 ou version ultérieure.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
